/* =====================================================================
   Bin Bypass collector app — reference implementation (web)
   Design tokens double as the future asset catalogue. Swift analogue:
   Color assets + a Theme struct. Light/dark validated for CVD.
   ===================================================================== */
:root{
  --bg:#F1F0EA; --page-ink:#1A2421; --page-muted:#5B6663;
  --frame:#0E1210; --frame-edge:#2A322E;
  --s-bg:#F6F5F1; --s-surface:#FFFFFF; --s-ink:#17211D; --s-muted:#5B6663;
  --s-line:#E6E4DC; --s-shadow:0 1px 3px rgba(23,33,29,.08),0 6px 18px rgba(23,33,29,.07);
  --green:#166534; --green-cta:#1B7A3F; --green-tint:#E2F1E7; --green-ink-on:#FFFFFF;
  --amber:#DC7A00; --amber-tint:#FAEEDC;
  --blue:#2563EB; --blue-tint:#E7EEFB;
  --grey:#8A948F; --grey-tint:#ECEEED;
  --map-land:#EDEBE2; --map-water:#CFE0E4; --map-park:#DFEADB; --map-road:#FFFFFF; --map-road2:#F7F5EE;
  --hero-money:#14532D; --depot:#173FA5;
}
[data-theme="dark"]{
  --bg:#0A0D0C; --page-ink:#EDF2EF; --page-muted:#93A09A;
  --s-bg:#0E1411; --s-surface:#182019; --s-ink:#EFF4F1; --s-muted:#9AA8A1;
  --s-line:#263029; --s-shadow:0 1px 3px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.45);
  --green:#28A55D; --green-cta:#28A55D; --green-tint:rgba(40,165,93,.16); --green-ink-on:#07130B;
  --amber:#D08004; --amber-tint:rgba(208,128,4,.16);
  --blue:#4C8DF6; --blue-tint:rgba(76,141,246,.16);
  --grey:#77837D; --grey-tint:rgba(119,131,125,.18);
  --map-land:#141B17; --map-water:#12222B; --map-park:#16241A; --map-road:#1F2A24; --map-road2:#1A231E;
  --hero-money:#3FBF74; --depot:#7FA9F8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--page-ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
.deskhint{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--page-muted);text-align:center}
/* desktop / tablet: the app as a centred column, full height */
.phone{width:440px;height:calc(100dvh - 72px);max-height:960px;background:var(--s-bg);border-radius:20px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.12),0 18px 40px rgba(10,20,15,.16);border:1px solid var(--frame-edge);position:relative;flex:0 0 auto;margin-top:28px}
.screenwrap{width:100%;height:100%;border-radius:20px;background:var(--s-bg);overflow:hidden;position:relative;color:var(--s-ink)}
.notch,.homebar{display:none !important}
.notch{position:absolute;top:21px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:var(--frame);border-radius:999px;z-index:80;pointer-events:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:126px;height:5px;border-radius:99px;background:var(--s-ink);opacity:.28;z-index:80;pointer-events:none}
.sbspace{height:52px;flex:0 0 auto}
@media (max-width:520px){
  body{display:block}
  .deskhint{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;border:none;box-shadow:none}
  .screenwrap{border-radius:0}
  .notch,.homebar{display:none}
  .sbspace{height:max(10px, env(safe-area-inset-top))}
  .tabbar{padding-bottom:max(14px, env(safe-area-inset-bottom)) !important}
}
#view{position:absolute;inset:0;display:flex;flex-direction:column}
.apphead{padding:6px 18px 10px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;gap:10px}
.apphead .t{font-size:22px;font-weight:800;letter-spacing:-.4px}

.apphead .back{display:flex;align-items:center;gap:10px;min-height:36px;cursor:pointer;min-width:0}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--s-surface);border:1px solid var(--s-line);display:grid;place-items:center;color:var(--s-muted);cursor:pointer;box-shadow:var(--s-shadow);flex:0 0 auto}
.chips{display:flex;gap:7px;padding:2px 14px 10px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;font-weight:600;padding:9px 13px;border-radius:999px;background:var(--s-surface);border:1px solid var(--s-line);color:var(--s-muted);box-shadow:var(--s-shadow);cursor:pointer;user-select:none}
.chip.on{background:var(--green-cta);border-color:var(--green-cta);color:var(--green-ink-on)}
.tabbar{height:78px;background:var(--s-surface);border-top:1px solid var(--s-line);display:flex;z-index:40;padding-bottom:14px;flex:0 0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--s-muted);cursor:pointer}
.tab.on{color:var(--green)}
.tab svg{width:24px;height:24px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green-cta);color:var(--green-ink-on);font-weight:700;border-radius:14px;padding:15px;font-size:16px;box-shadow:0 4px 14px rgba(27,122,63,.35);cursor:pointer;user-select:none}
.cta.sub{background:var(--s-surface);color:var(--s-ink);border:1px solid var(--s-line);box-shadow:var(--s-shadow)}
.cta.dis{opacity:.45;pointer-events:none}
.cta:active{transform:scale(.98)}
.card{background:var(--s-surface);border:1px solid var(--s-line);border-radius:16px;box-shadow:var(--s-shadow)}
.money{color:var(--hero-money);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot.live{background:var(--green)} .dot.stale{background:var(--amber)} .dot.off{background:var(--grey)}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.live{background:var(--green-tint);color:var(--green)}
.badge.stale{background:var(--amber-tint);color:var(--amber)}
.badge.open{background:var(--green-tint);color:var(--green)}
.badge.blue{background:var(--blue-tint);color:var(--blue)}
.badge.grey{background:var(--grey-tint);color:var(--s-muted)}
.row{display:flex;align-items:center;justify-content:space-between}
.hr{height:1px;background:var(--s-line);margin:12px 0}
.k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--s-muted)}
.seg{display:flex;background:var(--s-bg);border:1px solid var(--s-line);border-radius:12px;padding:3px;gap:3px}
.seg > div{flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px 2px;border-radius:9px;color:var(--s-muted);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;user-select:none}
.seg > div.on{background:var(--green-cta);color:var(--green-ink-on);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.seg svg{width:16px;height:16px}
.stepn{width:25px;height:25px;border-radius:50%;background:var(--green-cta);color:var(--green-ink-on);display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:0 0 auto}
.maparea{position:relative;flex:1;background:var(--map-land);overflow:hidden}
.pin-u{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:10;cursor:pointer}
.pin-u .b{min-width:38px;padding:6px 9px;border-radius:13px;background:var(--green-cta);color:var(--green-ink-on);font-size:14px;font-weight:800;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.28);border:2px solid var(--map-road)}
.pin-u .tip{width:2.5px;height:9px;background:var(--green-cta)}
.pin-u.stale .b{background:var(--amber)} .pin-u.stale .tip{background:var(--amber)}
.pin-u.off .b{background:var(--grey)} .pin-u.off .tip{background:var(--grey)}
.pin-u.sel .b{outline:3px solid var(--blue-tint)}
.pin-u.pulse .b{animation:pulse .9s ease 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(27,122,63,.55)}70%{box-shadow:0 0 0 16px rgba(27,122,63,0)}100%{box-shadow:0 0 0 0 rgba(27,122,63,0)}}
.pin-r{position:absolute;transform:translate(-50%,-50%);width:33px;height:33px;border-radius:10px;background:var(--blue);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.28);border:2px solid var(--map-road);z-index:9;cursor:pointer}
.pin-r svg{width:17px;height:17px}
.pin-r.depot{border-radius:50%;width:35px;height:35px;background:var(--depot)}
.pin-r.closed{opacity:.55}
.me{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 7px rgba(37,99,235,.22);z-index:11}
[data-theme="dark"] .me{border-color:#0E1411}
.legend{position:absolute;left:12px;top:10px;padding:9px 11px;font-size:10.5px;line-height:1.8;border-radius:12px;z-index:12}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;border-radius:20px;padding:14px 16px 15px;z-index:30;transform:translateY(135%);transition:transform .28s cubic-bezier(.3,1,.4,1)}
.sheet.up{transform:none}
.rack{display:flex;gap:7px}
.slot{flex:1;height:92px;border-radius:11px;border:1.5px solid var(--s-line);position:relative;background:var(--s-bg);overflow:hidden;display:flex;align-items:flex-end}
.slot .fill{width:100%;background:var(--green-tint);border-top:2.5px solid var(--green);height:78%}
.slot.empty .fill{display:none}
.slot .sn{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:var(--s-muted)}
.slot .st{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:var(--green)}
.slot.empty .st{color:var(--s-muted)}
.notif{position:absolute;top:56px;left:10px;right:10px;z-index:90;border-radius:18px;padding:13px 15px;display:flex;gap:11px;align-items:center;transform:translateY(-190%);transition:transform .35s cubic-bezier(.3,1,.4,1);cursor:pointer;background:var(--s-surface);border:1px solid var(--s-line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.notif.show{transform:none}
@media (max-width:520px){.notif{top:max(10px, env(safe-area-inset-top))}}
.toast{position:absolute;bottom:100px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--s-ink);color:var(--s-bg);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;z-index:95;transition:.3s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scroll{flex:1;overflow-y:auto;padding:2px 16px 16px;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.urow{padding:11px 14px;border-bottom:1px solid var(--s-line);display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:8px}
.urow:last-child{border-bottom:none}
.urow:active{background:var(--s-bg)}
.runrow{display:flex;gap:12px;padding:11px 14px;align-items:center;cursor:pointer}
.runrow .cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--s-line);flex:0 0 auto;display:grid;place-items:center;color:transparent}
.runrow.on .cb{background:var(--green-cta);border-color:var(--green-cta);color:var(--green-ink-on)}
/* site rack grid */
.ugrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.ucell{border:1.5px solid var(--s-line);border-radius:7px;height:46px;position:relative;overflow:hidden;background:var(--s-bg);display:flex;align-items:flex-end}
.ucell i{display:block;width:100%;background:var(--green-tint);border-top:2px solid var(--green)}
.ucell.full i{background:var(--green-cta);border-top:none}
.ucell.zero i{display:none}
.ucell span{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:700;color:var(--s-muted);z-index:1}
.ucell.full span{color:var(--green-ink-on)}
.fullbar{height:9px;border-radius:99px;background:var(--s-bg);border:1px solid var(--s-line);overflow:hidden}
.fullbar i{display:block;height:100%;border-radius:99px;background:var(--green-cta)}
/* onboarding */
.ob{position:absolute;inset:0;z-index:200;background:var(--s-bg);display:flex;flex-direction:column}
.ob .slides{flex:1;display:flex;transition:transform .35s cubic-bezier(.3,1,.4,1)}
.ob .slide{flex:0 0 100%;display:flex;flex-direction:column;padding:0 28px}
.ob .art{flex:1;display:grid;place-items:center}
.ob h2{font-size:25px;font-weight:800;letter-spacing:-.4px;text-align:center;line-height:1.2}

/* Site: one fence/park hosting a CLUSTER of Bin Bypass units.
   Each unit is a six-slot rack holding AT MOST SIX containers, so a
   site of 20 units holds 120 ($12.00). The production packet remains
   per-unit ({unit, slots[6], vbat_mv, rssi, epoch}); the API
   aggregates a site's units into what you see here.
   fills[] = containers currently in each rack (0–6). */
const nowEpoch=()=>Math.floor(Date.now()/1000);
const UNIT_CAP=6;
function mkFills(n,total){ /* deterministic even spread — units are emptied
   often, so racks RARELY sit full; fills differ by at most one, with a
   single popular rack per site allowed to run ahead */
 const f=Array(n).fill(0);
 const order=[...Array(n).keys()].sort((a,b)=>((a*7+3)%n)-((b*7+3)%n));
 let r=Math.min(total,n*UNIT_CAP),i=0;
 while(r>0){const idx=order[i%n];if(f[idx]<UNIT_CAP){f[idx]++;r--;}i++;}
 if(n>4&&f[0]<UNIT_CAP-1){const from=f.indexOf(Math.min(...f));if(from!==0&&f[from]>0){f[0]++;f[from]--;}}
 return f;
}
const SITES=[
 {id:"s1",host:"Sandy Bay Cricket Club",   area:"Sandy Bay",  hostEmoji:"🏏", unitCount:20, fills:mkFills(20,52), addedToday:48, sick:0, epoch:nowEpoch()-4*60,  km:1.2, x:48,y:63, saved:true, lastEmptied:"Tue 5 Aug", installed:"Mar 2026", lifetime:11240, stat:{full:6,turn:6.4,contam:2.1,cycle:1.1}},

   a container that stays in its slot while neighbouring slots are
   emptied. Confirmed at cash-in. */
const RVM_FEED=[
 {rp:"rp28",runs:14,wk:[3,3,4,4]},
 {rp:"rp13",runs:9, wk:[2,2,2,3]},
 {rp:"rp42",runs:6, wk:[1,1,2,2]},
 {rp:"rp18",runs:4, wk:[1,1,1,1]},
 {rp:"rp22",runs:3, wk:[0,1,1,1]}
];
/* Derived helpers — server-side in production (freshness computed
   at the API so every client agrees; see roadmap Phase 1). */
const CENTS=10;
const ready=s=>s.fills.reduce((a,b)=>a+b,0);
const capOf=s=>s.capacity!=null?Math.max(1,s.capacity):s.unitCount*UNIT_CAP;
const pctFull=s=>Math.round(ready(s)/capOf(s)*100);
const val=s=>ready(s)*CENTS/100;
const fmt$=n=>"$"+n.toFixed(2);
const uval=s=>fmt$(val(s));
const minsAgo=s=>Math.max(0,Math.round((nowEpoch()-s.epoch)/60));
const freshness=s=>{if(s.fresh)return s.fresh; /* live rows: server decides, per reporting cadence */
 const m=minsAgo(s);return m<30?"live":(m<180?"stale":"offline")};
/* Offline units (silent past 3x their reporting interval) still show
   their last known fill, but are not counted as ready anywhere money is
   totted up or a run is planned (APP-REVIEW 1.1). */
const counts=s=>freshness(s)!=="offline";
/* Value and runs count only units within RADIUS_KM of the collector; with no
   location set nothing is counted and the app asks for one. */
const RADIUS_KM=50;
const near=s=>!!s.ll&&s.km<=RADIUS_KM;
const avail=s=>counts(s)&&hasLoc()&&near(s)?ready(s):0;
const totalReady=()=>SITES.reduce((a,s)=>a+avail(s)*CENTS/100,0);
const totalCount=()=>SITES.reduce((a,s)=>a+avail(s),0);

const WORTH_OPTS=[2,5,10,20];
const worthMin=()=>{try{const v=parseFloat(localStorage.getItem("bb.worth"));return isFinite(v)&&v>=0?v:5}catch(e){return 5}};
function setWorth(v){try{localStorage.setItem("bb.worth",String(v))}catch(e){} render();}
/* Distances only mean something once we know where the collector is:
   before a GPS fix the app centres on the units (APP-REVIEW 1.9). */
const hasLoc=()=>DATA==="demo"||HOME_SRC==="gps"||HOME_SRC==="manual";
const hdrTotal=()=>hasLoc()?fmt$(totalReady())+" ready":"Set location";
const kmPart=km=>hasLoc()?` · ${km} km`:"";
/* Pin badge: the money, compact (APP-REVIEW 2). */
const pinVal=s=>{const v=ready(s)*CENTS/100;return v<10?"$"+v.toFixed(2):"$"+Math.round(v);};
/* Unit count only when a site has more than one rack. */
const rackPart=s=>s.unitCount>1?` · ${s.unitCount} racks`:"";
const isOpen=rp=>{const o=openNow(rp);if(o!==null)return o;const h=RP_HOURS[rp.type];const d=new Date();const hr=d.getHours()+d.getMinutes()/60;const wk=d.getDay()>=1&&d.getDay()<=5;return hr>=h.open&&hr<h.close&&(!h.weekdaysOnly||wk);};
/* ============================ MOCK API ============================ */
/* Simulates the cellular feed. In the port this becomes APIClient:
   GET /v1/units, GET /v1/refund-points, plus a poll/push channel. */
const Feed={
 listeners:[],
 subscribe(fn){this.listeners.push(fn)},
 emit(ev){this.listeners.forEach(f=>f(ev))},
 start(){
   setInterval(()=>{ /* someone drops containers into a rack at a live site */
     if(DATA!=="demo")return;
     const live=SITES.filter(s=>freshness(s)==="live"&&ready(s)<capOf(s));
     if(!live.length)return;
     const s=live[Math.floor(Math.random()*live.length)];
     let n=1+Math.floor(Math.random()*2);

function spark(s){
 let pts=[];
 if(s.week&&s.week.length===7){pts=[...s.week];} /* live: containers added per day, last 7 days */
 else{const seed=ready(s)+s.unitCount; const base=s.unitCount*5;
  for(let i=0;i<7;i++){pts.push(Math.max(2,Math.round(base*(0.65+(((seed*(i+3))%13)/22)))));}
  pts[6]=Math.max(s.addedToday,2);}
 const max=Math.max(1,...pts);
 const dn=i=>["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][(new Date().getDay()+i+1)%7]; const xs=pts.map((p,i)=>[8+i*45, 60-((p/max)*44)]);
 return `<svg viewBox="0 0 288 78" style="width:100%;margin-top:8px">
  <line x1="0" y1="64" x2="288" y2="64" stroke="var(--s-line)" stroke-width="1"/>
  <polyline points="${xs.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="${xs[6][0]}" cy="${xs[6][1]}" r="4.5" fill="var(--green)" stroke="var(--s-surface)" stroke-width="2"/>
  <text x="${xs[6][0]-8}" y="${Math.min(xs[6][1]+22,60)}" font-size="11.5" font-weight="700" fill="var(--s-ink)" text-anchor="end">${pts[6]} today</text>
  <text x="8" y="76" font-size="9.5" fill="var(--s-muted)">${s.week?dn(0):"Wed"}</text><text x="143" y="76" font-size="9.5" fill="var(--s-muted)" text-anchor="middle">${s.week?dn(3):"Sat"}</text><text x="278" y="76" font-size="9.5" fill="var(--s-muted)" text-anchor="end">Today</text>
 </svg>`;
}

   APP-REVIEW 3). The raw figures stay on the CDS unit page. */
function plainHealth(s){
 if(!s.health)return s.sick===0?{ok:true,title:"Working normally",sub:"Solar charged · strong signal"}:{ok:false,title:"Needs a look",sub:"We've been notified, nothing for you to do"};
 const n=s.health.length, off=s.health.filter(h=>h.fresh==="offline").length,
       low=s.health.filter(h=>h.tier==="low"||h.tier==="crit").length, flt=s.health.filter(h=>h.fault>0).length;
 const who=k=>n>1?`${k} of ${n} racks `:"";
 if(off)return {ok:false,title:who(off)+"Not reporting",sub:"We've been told. Fill shown is the last known."};

function defaultSel(){ /* best value per km within mode range, up to the carry limit */

   .sort((a,b)=>(ready(b)/Math.max(b.km,.5))-(ready(a)/Math.max(a.km,.5)));

   there (now + travel estimate), not merely open right now. At 5:30 am the

   ones that open at 7 (APP-REVIEW 1.3). */
function runDest(cans,at,etaMin){
 if(DATA==="live"){
   at=at||HOME; const eta=new Date(Date.now()+(etaMin||0)*60e3);
   const near=pred=>REFUND_POINTS.filter(r=>r.ll&&pred(r)).sort((a,b)=>dist(a.ll,at)-dist(b.ll,at));
   if(Store.state.mode==="drive"&&cans>=300){const d=near(r=>r.type==="Depot"&&openAt(r,eta))[0]; if(d)return d;}
   return near(r=>r.type==="RVM"&&openAt(r,eta))[0]||near(r=>r.type==="RVM")[0]||near(()=>true)[0];
 }
 const rvms=REFUND_POINTS.filter(r=>r.x!==undefined&&r.type==="RVM");

 if(Store.state.mode==="drive"&&cans>=300) return depot;

/* Run maths shared by the screen, Start and Finish. Stops in nearest-

   sum(unit km x 0.8) + a fixed 2.2 km). */
const RUN_SPEED={walk:80,bike:250,drive:500};            /* m/min, fallback estimate only (walk = WALK_MPM) */

const Run={key:"",res:null,busy:false,ac:null,t:null};
function runCalc(){
 if(!Store.state.runSel)Store.state.runSel=defaultSel();
 const mode=Store.state.mode, start={lat:HOME.lat,lng:HOME.lng};
 const sel=Store.state.runSel.map(id=>SITES.find(s=>s.id===id)).filter(s=>s&&avail(s)>0);
 const ordered=[...orderNN(start,sel.filter(s=>s.ll)),...sel.filter(s=>!s.ll)];
 const cnt=sel.reduce((a,s)=>a+avail(s),0);
 const lastLl=ordered.filter(s=>s.ll).slice(-1)[0];
 const at=lastLl?lastLl.ll:start;
 const toLast=ordered.filter(s=>s.ll).length?estLen(start,ordered.filter(s=>s.ll),at):0;
 const dest=runDest(cnt,at,toLast/RUN_SPEED[mode]+ordered.length*STOP_MIN);
 if(dest&&dest.ll){const withLl=orderStops(start,ordered.filter(s=>s.ll),dest.ll);ordered.splice(0,withLl.length,...withLl);}
 const pts=[start,...ordered.filter(s=>s.ll).map(s=>s.ll),dest&&dest.ll].filter(Boolean);
 const key=[mode,...pts.map(p=>p.lat.toFixed(5)+","+p.lng.toFixed(5))].join("|");
 let m=dest&&dest.ll?estLen(start,ordered.filter(s=>s.ll),dest.ll):toLast, secs=m/RUN_SPEED[mode]*60, routed=false;
 if(Run.key===key&&Run.res&&!Run.res.err){m=Run.res.m;secs=Run.res.s;routed=true;}
 const mins=Math.round(secs/60+ordered.length*STOP_MIN);
 const alt=DATA==="live"&&dest?REFUND_POINTS.filter(r=>r.ll&&r.type==="RVM"&&r!==dest).sort((a,b)=>dist(a.ll,at)-dist(b.ll,at))[0]:null;
 const altCloser=alt&&dest&&dest.ll&&dist(alt.ll,at)<dist(dest.ll,at)*0.6&&opensLater(alt)?alt:null;
 return {mode,start,sel,ordered,cnt,dest,at,pts,key,km:(m/1000).toFixed(1),mins,routed,altCloser};
}
function routeRun(R){

 clearTimeout(Run.t);

   if(Run.ac)Run.ac.abort();
   const ac=new AbortController(); Run.ac=ac; Run.key=R.key; Run.busy=true; Run.res=null;
   try{const r=await osrmRoute(R.pts,R.mode,ac.signal); if(Run.key===R.key)Run.res=r;}
   catch(e){if(Run.key===R.key)Run.res={err:String(e.message||e)};}   /* kept: a failure isn't retried on every render */
   if(Run.key===R.key){Run.busy=false; if(Store.state.screen.name==="run")render();}
 },400);
}

/* ============================ CDS MODE: FLEET DATA ============================
   Operator view on the live backend: every unit, its packets, slot events and
   exports. Reads the same Supabase REST API as the collector side (anon key,
   read-only). Swift analogue: a second root TabView behind the mode switch. */
const AppMode={
 get(){try{return localStorage.getItem("bb.appMode")==="cds"?"cds":"collector"}catch(e){return "collector"}},
 set(m){try{localStorage.setItem("bb.appMode",m)}catch(e){}
   Store.state.appMode=m; Store.tabTo(m==="cds"?"fleet":"map"); if(m==="cds")Fleet.refresh();}
};
const modeSw=(compact)=>{const c=Store.state.appMode==="cds";
 if(compact)return `<div class="modesw" onclick="AppMode.set('${c?"collector":"cds"}')"><span>⇄ ${c?"Collector":"CDS"}</span></div>`;
 return `<div class="modesw" onclick="AppMode.set('${c?"collector":"cds"}')"><span class="${c?"":"on"}">Collector</span><span class="${c?"on":""}">CDS</span></div>`;};
const apiHdr={apikey:API.key,Authorization:`Bearer ${API.key}`};
/* The public web version hides bench units (they sit at the developer's home); the iPhone app and ?bench show them */
const IS_NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.bbShare);
const SHOW_BENCH=IS_NATIVE||/[?&]bench\b/.test(location.search);
const publicUnits=rows=>SHOW_BENCH?rows:rows.filter(u=>u.status!=="bench"&&u.site_id!=="bench"&&u.status!=="retired");
async function apiGet(path){
 const r=await fetch(`${API.base}/${path}`,{headers:apiHdr});
 if(!r.ok)throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,120));
 return r.json();
}
async function apiAll(path,max=50000){ /* PostgREST caps a response at 1000 rows: page through */
 let out=[];
 for(let off=0;out.length<max;off+=1000){
   const rows=await apiGet(`${path}&limit=1000&offset=${off}`);
   out=out.concat(rows); if(rows.length<1000)break;
 }
 return out;
}
async function apiCount(path){
 const r=await fetch(`${API.base}/${path}${path.includes("?")?"&":"?"}select=id&limit=1`,{headers:{...apiHdr,Prefer:"count=exact"}});
 const cr=r.headers.get("content-range")||""; const n=+cr.split("/")[1]; return isNaN(n)?null:n;
}
const sinceIso=h=>new Date(Date.now()-h*3600e3).toISOString();
/* A unit that has been silent for more than a day: its windows end at its
   last packet, not now, so the history of an offline unit is still readable. */
const unitEnd=id=>{const u=Fleet.units.find(x=>x.unit_id===id);
 return u&&u.age_s>86400&&u.last_packet_at?Date.parse(u.last_packet_at)+1000:Date.now();};
const sinceFor=(id,h)=>id&&id!=="*"?new Date(unitEnd(id)-h*3600e3).toISOString():sinceIso(h);
const ago=s=>s==null?"never":s<90?`${s}s ago`:s<5400?`${Math.round(s/60)} min ago`:s<172800?`${Math.round(s/3600)} h ago`:`${Math.round(s/86400)} d ago`;
const tLbl=(ms,h)=>{const d=new Date(ms);return h<=24?d.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}):d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric"})+" "+d.toLocaleTimeString("en-AU",{hour:"numeric"});};
const tFull=ms=>new Date(ms).toLocaleString("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",second:"2-digit"});
const parseSlots=s=>{if(Array.isArray(s))return s;try{return JSON.parse(s)}catch(e){return []}};
const vFmt=mv=>mv==null?"—":(mv/1000).toFixed(3)+" V";
const WINS=[[6,"6 h"],[24,"24 h"],[72,"3 d"],[168,"7 d"],[720,"30 d"]];

const Fleet={
 units:[],at:0,err:null,loading:false,all:false,sort:"seen",pk24:null,suspects:[],
 detail:{id:null,win:24,rows:[],ev:[],cmds:[],loading:false,err:null,at:0},
 act:{win:168,ev:[],loading:false,err:null,at:0},
 exp:{mode:"all",unit:"*",city:null,suburb:null,picked:[],q:"",win:168,set:"packets",count:null,busy:false,meta:null},
 async refresh(){
   this.loading=true;
   try{ this.units=publicUnits(await apiGet("unit_live?select=*")); this.err=null; this.at=Date.now();
        this.pk24=await apiCount(`packets?received_at=gte.${sinceIso(24)}`);
        this.suspects=await apiGet("slot_suspects?select=*&order=held_s.desc"); notifySuspects(this.suspects); }
   catch(e){this.err=String(e.message||e);}
   this.loading=false; if(cdsScreen())render();
 },
 shown(){
   let u=this.units.filter(x=>this.all||(x.age_s!=null&&x.age_s<14*86400));
   const by={seen:x=>x.age_s??1e12, batt:x=>x.vbat_mv??99999, sig:x=>-(x.rssi||-200), fill:x=>-(x.filled||0)}[this.sort];
   return u.sort((a,b)=>by(a)-by(b));
 },
 async loadDetail(id,win){
   const d=this.detail; if(id&&id!==d.id){d.show=50;d.cmds=[];} if(id)d.id=id; if(win)d.win=win;
   d.loading=true; d.err=null; if(cdsScreen())render(); this.loadCmds(d.id);
   try{
     if(!this.units.length)await this.refresh().catch(()=>{});
     const since=sinceFor(d.id,d.win);
     const [rows,ev]=await Promise.all([
       apiAll(`packets?unit_id=eq.${encodeURIComponent(d.id)}&received_at=gte.${since}&order=id.asc&select=id,received_at,src,seq,epoch,slots,vbat_mv,chg,rssi,snr,fw,tier,hb,flags`),
       apiAll(`slot_events?unit_id=eq.${encodeURIComponent(d.id)}&changed_at=gte.${since}&order=id.asc&select=id,unit_id,slot,state,changed_at`)]);
     d.rows=rows; d.ev=withKinds(ev); d.at=Date.now();
   }catch(e){d.err=String(e.message||e);}
   d.loading=false; if(cdsScreen())render();
 },
 /* Live reporting requests and the unit's answers (table unit_commands). */
 async loadCmds(id){

     if(d.id===id){d.cmds=c; if(Store.state.screen.name==="fleetunit")render();}}catch(e){}
 },
 async loadAct(win){
   const a=this.act; if(win)a.win=win; a.loading=true; a.err=null; if(cdsScreen())render();
   try{ a.ev=withKinds(await apiAll(`slot_events?changed_at=gte.${sinceIso(a.win)}&order=id.asc&select=id,unit_id,slot,state,changed_at`)); a.at=Date.now(); }
   catch(e){a.err=String(e.message||e);}

};
const cdsScreen=()=>["fleet","fleetunit","activity","cds","export"].includes(Store.state.screen.name);
/* Passed-over containers (view slot_suspects, migration 2026-11-09): a slot
   still holding the same container after 3+ others at its unit or site were
   collected - likely contaminated or not refundable. Each container
   (unit, slot, since) notifies once; the native shell shows it as an iOS
   notification (bbNotify), a browser just gets a toast. */
const hrs=s=>s>=86400?`${Math.round(s/86400)} d`:`${Math.max(1,Math.round(s/3600))} h`;
function suspectText(x){return `${x.label||x.unit_id} slot ${x.slot}: held ${hrs(x.held_s)} while ${x.passed_over} others were collected`;}
function notifySuspects(list){
 let seen=[]; try{seen=JSON.parse(localStorage.getItem("bb.suspectSeen")||"[]");}catch(e){}
 const key=x=>`${x.unit_id}:${x.slot}:${x.since}`, live=new Set(list.map(key));
 const fresh=list.filter(x=>!seen.includes(key(x)));
 const h=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.bbNotify;
 fresh.forEach(x=>{const body=suspectText(x)+". Check it for contamination.";
   if(h)h.postMessage({id:"suspect-"+key(x),title:"Container passed over",body}); else toast("Passed over: "+suspectText(x));});
 try{localStorage.setItem("bb.suspectSeen",JSON.stringify([...live]));}catch(e){}   /* forget cleared ones */
}
/* added / emptied from consecutive states of the same slot (the first event
   of each slot in the window has no known previous state) */
function withKinds(ev){
 const prev={};
 return ev.map(e=>{const k=e.unit_id+"/"+e.slot,p=prev[k];prev[k]=e.state;
   return {...e,t:Date.parse(e.changed_at),kind:e.state===255?"fault":p===0&&e.state===1?"added":p===1&&e.state===0?"emptied":"other"};});
}

/* ---- SVG line chart (no library: works offline, themed by CSS vars) ---- */
function chartSvg(series,o={}){
 const W=340,H=o.h||130,L=38,R=8,T=8,B=20;
 const all=series.flatMap(s=>s.pts).filter(p=>p.v!=null&&!isNaN(p.v));
 if(all.length<2)return `<div class="cempty">Not enough data in this window</div>`;
 const t0=o.t0??Math.min(...all.map(p=>p.t)), t1=o.t1??Math.max(...all.map(p=>p.t));
 let lo=o.yMin??Math.min(...all.map(p=>p.v)), hi=o.yMax??Math.max(...all.map(p=>p.v));
 (o.refs||[]).forEach(r=>{if(r.keep){lo=Math.min(lo,r.v);hi=Math.max(hi,r.v);}});
 if(hi-lo<1e-9){hi+=1;lo-=1;} const pad=(hi-lo)*.08; if(o.yMin==null)lo-=pad; if(o.yMax==null)hi+=pad;
 const X=t=>L+(t-t0)/((t1-t0)||1)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
 const fmt=o.fmt||(v=>v.toFixed(0));
 let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
 (o.bands||[]).forEach(b=>{const x0=X(Math.max(b.t0,t0)),x1=X(Math.min(b.t1,t1)); if(x1>x0)s+=`<rect x="${x0.toFixed(1)}" y="${T}" width="${(x1-x0).toFixed(1)}" height="${H-T-B}" style="fill:${b.color||"var(--green-tint)"}"/>`;});
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--s-line)"/><text x="${L-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" class="ct">${fmt(v)}</text>`;}
 (o.refs||[]).forEach(r=>{if(r.v>lo&&r.v<hi){const y=Y(r.v);s+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${r.color||"var(--amber)"};stroke-dasharray:4 3"/><text x="${W-R-2}" y="${(y-3).toFixed(1)}" text-anchor="end" class="ct" style="fill:${r.color||"var(--amber)"}">${r.label}</text>`;}});
 series.forEach(se=>{
   const pts=se.pts.filter(p=>p.v!=null&&!isNaN(p.v)); if(!pts.length)return;
   const dts=pts.slice(1).map((p,i)=>p.t-pts[i].t).sort((a,b)=>a-b);
   const gap=o.gap||Math.max(3*(dts[Math.floor(dts.length/2)]||0),20*60e3);
   let d="";
   pts.forEach((p,i)=>{const x=X(p.t).toFixed(1),y=Y(p.v).toFixed(1);
     if(i===0||p.t-pts[i-1].t>gap)d+=`M${x} ${y}`;
     else d+=se.step?`H${x}V${y}`:`L${x} ${y}`;});
   s+=`<path d="${d}" style="fill:none;stroke:${se.color||"var(--blue)"};stroke-width:1.8;stroke-linejoin:round"/>`;
   if(pts.length<60)pts.forEach(p=>{s+=`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="1.8" style="fill:${se.color||"var(--blue)"}"/>`;});
 });
 const h=(t1-t0)/3600e3;
 s+=`<text x="${L}" y="${H-5}" class="ct">${tLbl(t0,h)}</text><text x="${(L+W-R)/2}" y="${H-5}" text-anchor="middle" class="ct">${tLbl((t0+t1)/2,h)}</text><text x="${W-R}" y="${H-5}" text-anchor="end" class="ct">${tLbl(t1,h)}</text></svg>`;
 return s;
}
function barSvg(days){ /* [{label,a,b}] a=added (green) b=emptied (blue) */
 const W=340,H=120,L=8,R=8,T=8,B=20,n=days.length,max=Math.max(1,...days.map(d=>Math.max(d.a,d.b)));
 const bw=(W-L-R)/n; let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
 days.forEach((d,i)=>{const x=L+i*bw,h1=(H-T-B)*d.a/max,h2=(H-T-B)*d.b/max,w=Math.max(2,bw*.36);
   s+=`<rect x="${(x+bw*.12).toFixed(1)}" y="${(H-B-h1).toFixed(1)}" width="${w.toFixed(1)}" height="${h1.toFixed(1)}" rx="1.5" style="fill:var(--green)"/>`;
   s+=`<rect x="${(x+bw*.52).toFixed(1)}" y="${(H-B-h2).toFixed(1)}" width="${w.toFixed(1)}" height="${h2.toFixed(1)}" rx="1.5" style="fill:var(--blue)"/>`;
   if(n<=10||i%Math.ceil(n/7)===0)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" class="ct">${d.label}</text>`;});
 return s+`</svg>`;
}
const slotDots=(sl,big)=>`<div class="sdots${big?" big":""}">${parseSlots(sl).map((v,i)=>`<i class="${v===1?"f":v===0?"e":"x"}">${big?(i+1):""}</i>`).join("")}</div>`;
const fBadge=f=>`<span class="badge ${f==="live"?"live":f==="stale"?"stale":"grey"}">${f||"offline"}</span>`;
const loadingLine=(l,err,at)=>err?`<div class="cerr">Couldn't load: ${esc(err)}</div>`:l?`<div class="cnote">Loading…</div>`:at?`<div class="cnote">Updated ${new Date(at).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})}</div>`:"";

/* ---- Live reporting switch (firmware 0.3.25+) ----
   The app only asks: request_unit_command() checks the operator code in the
   database and queues the request. The command agent, on the machine that
   holds the fleet key, signs and sends it; the unit acts at its next
   check-in. Swift analogue: a Toggle bound to the requested state, with the
   confirmed state shown beside it. */
const LIVE_MIN_FW="0.3.25";
const fwAtLeast=(fw,min)=>{if(!fw)return false; const a=String(fw).split(".").map(n=>parseInt(n)||0),b=min.split(".").map(Number);
 for(let i=0;i<3;i++){if((a[i]||0)!==b[i])return (a[i]||0)>b[i];} return true;};
const tShort=iso=>{const d=new Date(iso),same=d.toDateString()===new Date().toDateString();
 return (same?"":d.toLocaleDateString("en-AU",{day:"numeric",month:"short"})+" ")+d.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"});};
const LiveRpt={
 busy:false,
 code(){try{return localStorage.getItem("bb.opCode")||""}catch(e){return ""}},
 setCode(v){try{v?localStorage.setItem("bb.opCode",v):localStorage.removeItem("bb.opCode")}catch(e){}},
 state(cmds){ /* cmds newest first */
   const done=cmds.find(c=>c.status==="done"), open=cmds.find(c=>c.status==="queued"||c.status==="sent");
   const pend=open&&(!done||open.id>done.id)?open:null, last=cmds[0]||null;
   return {on:done?done.verb==="LIVEON":null,done,pend,
           failed:last&&["refused","unknown","failed"].includes(last.status)?last:null};
 },
 async ask(unit,verb){
   if(this.busy)return;
   if(!this.code()){this.prompt(unit,verb);return;}
   this.busy=true; render();
   try{
     const r=await fetch(`${API.base}/rpc/request_unit_command`,{method:"POST",headers:{...apiHdr,"Content-Type":"application/json"},
       body:JSON.stringify({p_unit:unit,p_verb:verb,p_code:this.code()})});
     const j=await r.json().catch(()=>({}));
     if(!r.ok)throw new Error(j.message||("HTTP "+r.status));
     if(j.ok)toast(verb==="LIVEON"?"Switch-on requested":"Switch-off requested");
     else if(j.error==="code"){this.setCode("");this.busy=false;this.prompt(unit,verb,"That code was not accepted.");return;}
     else toast({unit:"Unit not found",verb:"Not a command the app can send",busy:"Too many requests this hour. Try again later."}[j.error]||"Not sent");
   }catch(e){toast("Not sent: "+String(e.message||e).slice(0,70));}
   this.busy=false; await Fleet.loadCmds(unit); render();
   setTimeout(()=>Fleet.loadCmds(unit),10000); setTimeout(()=>Fleet.loadCmds(unit),25000);
 },
 prompt(unit,verb,msg){
   modal(`<div class="mtitle">Operator code</div>
    <div class="fmeta" style="margin:0">${msg?`<b style="color:var(--amber)">${esc(msg)}</b> `:""}Changing a unit needs the operator code. It is asked for once on this phone.</div>
    <input class="codein" id="opcode" inputmode="numeric" autocomplete="off" placeholder="Code">
    <div style="display:flex;gap:8px">
     <div class="cta sub" style="flex:1;padding:12px;font-size:14px" onclick="closeModal()">Cancel</div>
     <div class="cta" style="flex:1;padding:12px;font-size:14px" data-unit="${escA(unit)}" data-verb="${escA(verb)}" onclick="LiveRpt.save(this.dataset.unit,this.dataset.verb)">Continue</div>
    </div>`);
   setTimeout(()=>{const i=$("opcode");if(i)i.focus();},300);
 },
 save(unit,verb){const v=(($("opcode")||{}).value||"").replace(/[^0-9]/g,""); if(!v)return; this.setCode(v); closeModal(); this.ask(unit,verb);}
};
function liveCard(x,cmds){
 const s=LiveRpt.state(cmds), fwOk=fwAtLeast(x.fw,LIVE_MIN_FW), lowCell=x.tier==="low"||x.tier==="crit";
 const want=fwOk&&(s.pend?s.pend.verb==="LIVEON":s.on===true);  /* where the switch sits */
 const next=want?"LIVEOFF":"LIVEON";
 let line;
 if(!fwOk)line=`Needs firmware ${LIVE_MIN_FW} or later. This unit ${x.fw?"is on "+esc(String(x.fw)):"has not reported a firmware version"}.`
   +(s.pend?` A switch-${s.pend.verb==="LIVEON"?"on":"off"} from ${tShort(s.pend.requested_at)} is waiting; this firmware will not act on it.`:"");
 else if(s.pend&&s.pend.status==="queued")line=(Date.now()-Date.parse(s.pend.requested_at)>90e3)
   ?`<span style="color:var(--amber);font-weight:700">Not sent yet.</span> Requested ${tShort(s.pend.requested_at)}. The sender on the Mac is not running, or the Mac is asleep or offline.`
   :`Switch-${s.pend.verb==="LIVEON"?"on":"off"} requested ${tShort(s.pend.requested_at)}. Sending…`;
 else if(s.pend)line=`Switch-${s.pend.verb==="LIVEON"?"on":"off"} sent ${tShort(s.pend.sent_at||s.pend.requested_at)}. The unit picks it up at its next check-in: within the hour, or sooner if a slot changes.`;
 else if(s.failed)line=`<span style="color:var(--amber);font-weight:700">Last request did not take effect.</span> ${esc(String(s.failed.note||""))}${s.done?` Still ${s.on?"on":"off"}.`:""}`;
 else if(s.done)line=`${s.on?"On":"Off"} since ${tShort(s.done.done_at||s.done.requested_at)}, confirmed by the unit${s.done.origin==="bench"?" (set from the bench)":""}.`;
 else line="Off unless it has been switched on from the bench. No request on record for this unit.";
 if(fwOk&&lowCell&&want)line+=` <span style="color:var(--amber);font-weight:700">Paused while the cell is ${esc(String(x.tier))}.</span>`;
 const cls=`tgl ${want?"on":""} ${s.pend||LiveRpt.busy?"wait":""} ${fwOk?"":"dis"}`;
 return `<div class="card" style="padding:14px 15px;margin-top:12px">
   <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div style="min-width:0"><div style="font-size:15px;font-weight:800">Live reporting</div>
     <div class="fmeta" style="margin-top:2px">${fwOk?(s.pend?(want?"Switching on":"Switching off"):s.on===true?"On":s.on===false?"Off":"Off (not confirmed)"):"Not available"}</div></div>
    <div class="${cls}" data-unit="${escA(x.unit_id)}" ${fwOk?`onclick="LiveRpt.ask(this.dataset.unit,'${next}')"`:""}><i></i></div>
   </div>
   <div class="fmeta" style="margin-top:9px;line-height:1.45">${line}</div>
   <div class="cnote" style="padding:8px 0 0">On: a cell update about a minute after a slot changes, day and night, while the cell is healthy. About 1 mAh per update, so a busy rack uses the cell much faster.</div>
  </div>`;
}

/* ---- Unit detail ---- */
Views.fleetunit=(p)=>{
 const d=Fleet.detail,x=Fleet.units.find(u=>u.unit_id===p.id)||{unit_id:p.id};
 const rows=d.id===p.id?d.rows:[], ev=d.id===p.id?d.ev:[];
 const pts=rows.map(r=>({t:Date.parse(r.received_at),r}));
 const t1=unitEnd(p.id),t0=t1-d.win*3600e3, past=Date.now()-t1>60e3;
 const bands=[]; pts.forEach((q,i)=>{if(q.r.chg===1)bands.push({t0:q.t,t1:(pts[i+1]||{t:q.t+60e3}).t});});
 const mvs=rows.map(r=>r.vbat_mv).filter(Boolean), rs=rows.map(r=>r.rssi).filter(v=>v&&v<0);
 const srcN={}; rows.forEach(r=>srcN[r.src]=(srcN[r.src]||0)+1);
 let maxGap=0; pts.forEach((q,i)=>{if(i)maxGap=Math.max(maxGap,q.t-pts[i-1].t);});
 const chgPct=rows.length?Math.round(100*rows.filter(r=>r.chg===1).length/rows.length):null;
 const lifepo=mvs.length&&Math.max(...mvs)<3800;
 const st=(v,l)=>`<div class="st2"><b>${v}</b><span>${l}</span></div>`;

   buckets.push({label:d.toLocaleDateString("en-AU",{weekday:days<=7?"short":undefined,day:days>7?"numeric":undefined}),a:inD.filter(e=>e.kind==="added").length,b:inD.filter(e=>e.kind==="emptied").length});}
 const per={}; ev.forEach(e=>{const p=per[e.unit_id]||(per[e.unit_id]={a:0,b:0,f:0});if(e.kind==="added")p.a++;else if(e.kind==="emptied")p.b++;else if(e.kind==="fault")p.f++;});

  </div>

  <div class="card cbox">${barSvg(buckets)}</div>
  <div class="k" style="margin:14px 2px 6px">By unit</div>
  <div class="card" style="overflow:hidden">${Object.entries(per).sort((x,y)=>(y[1].a+y[1].b)-(x[1].a+x[1].b)).map(([id,p])=>`

  <div class="k" style="margin:14px 2px 6px">Latest events</div>
  <div class="card" style="overflow:hidden">${ev.slice().reverse().slice(0,80).map(e=>`
   <div class="prow"><span>${tFull(e.t)}</span><span class="mono">${esc(e.unit_id)}</span><span>slot ${e.slot}</span><span class="${e.kind==="added"?"gk":e.kind==="emptied"?"bk":e.kind==="fault"?"ak":""}">${e.kind}</span></div>`).join("")||`<div class="cnote" style="padding:12px">Nothing yet.</div>`}</div>

/* Which units an export covers: all, a city (site), a suburb, or a hand-picked set */
async function expMeta(){
 const e=Fleet.exp; e.meta={sites:{},sub:{}};
 try{const [sites,us]=await Promise.all([apiGet("sites?select=site_id,name,area"),apiGet("units?select=unit_id,site_id,suburb")]);
   sites.forEach(x=>e.meta.sites[x.site_id]=x); us.forEach(u=>e.meta.sub[u.unit_id]={site:u.site_id,suburb:u.suburb});}catch(err){}
 render();
}
const expSiteName=id=>{const m=Fleet.exp.meta&&Fleet.exp.meta.sites[id];return m?(m.name||id):(id||"No site");};
function expIds(){                       /* null = every unit */
 const e=Fleet.exp, all=Fleet.units.filter(x=>x.age_s!=null), M=(e.meta&&e.meta.sub)||{};
 if(e.mode==="city")return e.city==null?[]:all.filter(u=>(u.site_id||"")===e.city).map(u=>u.unit_id);
 if(e.mode==="suburb")return e.suburb==null?[]:all.filter(u=>{const m=M[u.unit_id];return m&&m.suburb&&`${m.suburb}|${m.site||""}`===e.suburb;}).map(u=>u.unit_id);
 if(e.mode==="pick")return e.picked.slice();
 return null;
}
function expMode(k){const e=Fleet.exp; e.mode=k; expCount();}
function expPick(id){const e=Fleet.exp, i=e.picked.indexOf(id); i<0?e.picked.push(id):e.picked.splice(i,1); expCount();}
function expSelText(){
 const e=Fleet.exp, ids=expIds();
 if(!ids)return `Every unit (${Fleet.units.filter(x=>x.age_s!=null).length}).`;
 if(e.mode==="city")return e.city==null?"Pick a city.":`${expSiteName(e.city)}: ${ids.length} units.`;
 if(e.mode==="suburb")return e.suburb==null?"Pick a suburb.":`${e.suburb.split("|")[0]}, ${expSiteName(e.suburb.split("|")[1])}: ${ids.length} unit${ids.length===1?"":"s"}.`;
 return ids.length?`${ids.length} unit${ids.length===1?"":"s"} picked. <span style="color:var(--green);font-weight:700;cursor:pointer" onclick="Fleet.exp.picked=[];expCount()">Clear</span>`:"Tap units to add them.";
}
function expPicker(units){
 const e=Fleet.exp, M=(e.meta&&e.meta.sub)||{};
 if(e.mode==="all")return "";
 if(e.mode==="city"){const n={}; units.forEach(u=>{const k=u.site_id||"";n[k]=(n[k]||0)+1;});
   return `<div class="chips" style="padding:8px 0 4px;flex-wrap:wrap">${Object.keys(n).sort((a,b)=>expSiteName(a).localeCompare(expSiteName(b))).map(k=>
     `<div class="chip ${e.city===k?"on":""}" onclick="Fleet.exp.city='${esc(k)}';expCount()">${esc(expSiteName(k))} <span style="opacity:.6">${n[k]}</span></div>`).join("")}</div>`;}
 const q=(e.q||"").toLowerCase();
 const search=`<input placeholder="${e.mode==="suburb"?"Filter suburbs":"Filter by name, id, suburb or city"}" value="${esc(e.q||"")}" oninput="Fleet.exp.q=this.value;expRedrawList()" style="margin-top:8px;width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--s-line);background:var(--s-bg);color:var(--s-ink);font-size:14px;font-family:inherit;outline:none">`;
 return search+`<div id="exp-list">${expList(units,q)}</div>`;
}
function expList(units,q){
 const e=Fleet.exp, M=(e.meta&&e.meta.sub)||{};
 if(e.mode==="suburb"){const n={}; units.forEach(u=>{const m=M[u.unit_id]; if(m&&m.suburb){const k=`${m.suburb}|${m.site||""}`;n[k]=(n[k]||0)+1;}});
   const keys=Object.keys(n).filter(k=>!q||(k.split("|")[0]+" "+expSiteName(k.split("|")[1])).toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b));
   return `<div class="chips" style="padding:8px 0 4px;flex-wrap:wrap;max-height:260px;overflow:auto">${keys.map(k=>
     `<div class="chip ${e.suburb===k?"on":""}" onclick="Fleet.exp.suburb='${esc(k)}';expCount()">${esc(k.split("|")[0])} · ${esc(expSiteName(k.split("|")[1]))} <span style="opacity:.6">${n[k]}</span></div>`).join("")||`<div class="fmeta">No suburbs match.</div>`}</div>`;}
 const rows=units.filter(u=>{if(!q)return true;const m=M[u.unit_id]||{};return `${u.label||""} ${u.unit_id} ${m.suburb||""} ${expSiteName(u.site_id)}`.toLowerCase().includes(q);});
 return `<div class="chips" style="padding:8px 0 4px;flex-wrap:wrap;max-height:260px;overflow:auto">${rows.slice(0,300).map(x=>
   `<div class="chip mono ${e.picked.includes(x.unit_id)?"on":""}" style="${x.age_s>=30*86400?"opacity:.7":""}" onclick="expPick('${esc(x.unit_id)}')">${esc(x.label||x.unit_id)}</div>`).join("")}
   ${rows.length>300?`<div class="fmeta" style="width:100%">Showing 300 of ${rows.length}. Filter to narrow.</div>`:""}</div>`;
}
function expRedrawList(){const el=$("exp-list"); if(el)el.innerHTML=expList(Fleet.units.filter(x=>x.age_s!=null).sort((a,b)=>a.age_s-b.age_s),(Fleet.exp.q||"").toLowerCase());}
function expFilter(){const ids=expIds(); return ids?`unit_id=in.(${ids.map(encodeURIComponent).join(",")})&`:"";}
function expSince(win){const ids=expIds(); return ids&&ids.length===1?sinceFor(ids[0],win):sinceIso(win);}
function expTag(){const e=Fleet.exp, ids=expIds(); if(!ids)return "all";
 const slug=x=>String(x).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
 if(e.mode==="city")return slug(expSiteName(e.city)); if(e.mode==="suburb")return slug(e.suburb.split("|")[0]+"-"+expSiteName(e.suburb.split("|")[1]));
 return ids.length===1?ids[0]:ids.length+"-units";}
async function expCount(){
 const e=Fleet.exp; e.count=null; render();
 if(e.set==="units")return;
 const col=e.set==="packets"?"received_at":"changed_at", tbl=e.set==="packets"?"packets":"slot_events";
 const ids=expIds(); if(ids&&!ids.length){e.count=0;render();return;}
 e.count=await apiCount(`${tbl}?${expFilter()}${e.win?`${col}=gte.${expSince(e.win)}`:"id=gt.0"}`).catch(()=>null); render();
}
const csvCell=v=>{if(v==null)return "";const s=String(v);return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
const toCsv=(cols,rows)=>[cols.join(","),...rows.map(r=>cols.map(c=>csvCell(r[c])).join(","))].join("\n");
function packetsFlat(rows){
 return rows.map(r=>{const sl=parseSlots(r.slots);let via="",flags=r.flags;try{const j=JSON.parse(r.raw||"{}");via=j.via||"";}catch(e){}
   return {...r,s1:sl[0],s2:sl[1],s3:sl[2],s4:sl[3],s5:sl[4],s6:sl[5],via,need_relay:flags!=null?((flags&0x20)?1:0):""};});
}
const PCOLS=["id","received_at","unit_id","src","via","seq","epoch","vbat_mv","chg","tier","rssi","snr","fw","hb","flags","need_relay","s1","s2","s3","s4","s5","s6"];
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,"");
const EXP_MAX=200000;   /* rows per export file */
async function exportPackets(win,fmt){
 toast("Fetching packets…");
 try{const rows=await apiAll(`packets?${expFilter()}${win?`received_at=gte.${expSince(win)}`:"id=gt.0"}&order=id.asc&select=*`,EXP_MAX);
   if(rows.length>=EXP_MAX)toast(`Stopped at ${EXP_MAX.toLocaleString()} rows. Narrow the unit or window for the rest.`);
   const name=`binbypass-${expTag()}-packets-${stamp()}.${fmt}`;
   if(fmt==="csv")exportFile(name,toCsv(PCOLS,packetsFlat(rows)),"text/csv");
   else exportFile(name,JSON.stringify(rows.map(r=>{let raw=r.raw;try{raw=JSON.parse(r.raw)}catch(e){}return {...r,slots:parseSlots(r.slots),raw};}),null,1),"application/json");
 }catch(e){toast("Export failed: "+e.message);}
}
async function exportEvents(win,fmt="csv"){
 toast("Fetching slot events…");

/* ============================ WALK PLANNER ============================
   "How long do you want to walk, and do you want to finish at an RVM?"
   Picks the sites worth collecting inside that walk, orders them, and
   draws the real footpath route (OSRM foot profile, routing.openstreetmap.de)
   on the map. Straight-line estimates choose the stops; the routed distance
   checks them, dropping the weakest stop until the walk fits. */
const WALK_MPM=80;                 /* metres a minute, ~4.8 km/h */
const DETOUR=1.35;                 /* footpath vs straight line, for choosing stops */
const OSRM="https://routing.openstreetmap.de/routed-foot";
const Walk={mins:30,endRvm:true,openOnly:true,plan:null,busy:false,err:null,key:""};
/* Return points a route may finish at: anything that pays a refund
   (machines, depots, bag drops, counters, pop-ups), not donation-only bins. */
const rpPays=r=>r.ll&&r.type!=="Donation";
const openWhen=(r,eta)=>{const o=openAt(r,eta);return o===null?isOpen(r):o;};
let wmap=null,wmarkers=[];
const kmA=(a,b)=>dist(a,b);          /* km, straight line */
function walkCandidates(D){
 const start={lat:HOME.lat,lng:HOME.lng};
 const reach=(Walk.endRvm?D:D/2)/DETOUR/1000;   /* km straight-line catchment */
 const sites=SITES.filter(s=>s.ll&&avail(s)>0&&kmA(start,s.ll)<=reach)
   .sort((a,b)=>avail(b)/Math.max(kmA(start,b.ll),.1)-avail(a)/Math.max(kmA(start,a.ll),.1)).slice(0,8);
 /* nearest 15 paying return points within reach; whether each is open is
    judged at the time you'd get there, in bestPlan */
 const rvms=Walk.endRvm?REFUND_POINTS.filter(r=>rpPays(r)&&kmA(start,r.ll)<=D/DETOUR/1000)
   .sort((a,b)=>kmA(start,a.ll)-kmA(start,b.ll)).slice(0,15):[];
 return {start,reach,sites,rvms};
}
function orderNN(start,stops){ /* nearest neighbour from the start */
 const left=[...stops],out=[];let at=start;
 while(left.length){left.sort((a,b)=>kmA(at,a.ll)-kmA(at,b.ll));const n=left.shift();out.push(n);at=n.ll;}
 return out;
}
function estLen(start,stops,end){let m=0,at=start;stops.forEach(s=>{m+=kmA(at,s.ll);at=s.ll;});m+=kmA(at,end);return m*1000*DETOUR;}
/* Visiting order for a fixed start AND finish, so the route sweeps past the
   units towards the return point instead of nearest-first from the start
   and doubling back. Exact for up to 6 stops (at most 720 orders), else
   nearest-neighbour improved by 2-opt. */
function orderStops(start,stops,end){
 if(stops.length<2)return [...stops];
 const len=a=>{let m=0,at=start;for(const x of a){m+=kmA(at,x.ll);at=x.ll;}return m+(end?kmA(at,end):0);};
 if(stops.length<=6){
   let best=null,bl=Infinity; const a=[...stops];
   const perm=l=>{ if(l===a.length){const d=len(a);if(d<bl){bl=d;best=[...a];}return;}
     for(let i=l;i<a.length;i++){[a[l],a[i]]=[a[i],a[l]];perm(l+1);[a[l],a[i]]=[a[i],a[l]];} };
   perm(0); return best;
 }
 let r=orderNN(start,stops), cur=len(r), better=true;
 while(better){better=false;
   for(let i=0;i<r.length-1;i++)for(let j=i+1;j<r.length;j++){
     const c=[...r.slice(0,i),...r.slice(i,j+1).reverse(),...r.slice(j+1)], d=len(c);
     if(d<cur-1e-9){r=c;cur=d;better=true;}}}
 return r;
}
function bestPlan(c,D,excl=new Set()){
 const pool=c.sites.filter(s=>!excl.has(s.id)), n=pool.length;
 const ends=Walk.endRvm?c.rvms:[{ll:c.start,home:true}];
 let best=null;
 for(let mask=1;mask<(1<<n);mask++){          /* at least one unit: a route is for collecting */
   const pick=pool.filter((_,i)=>mask&(1<<i)), n2=pick.reduce((a,s)=>a+avail(s),0);
   if(best&&n2<best.n)continue;               /* can't beat what we have */
   for(const e of ends){
     const stops=orderStops(c.start,pick,e.ll), m=estLen(c.start,stops,e.ll); if(m>D)continue;
     const eta=new Date(Date.now()+(m/WALK_MPM+stops.length*STOP_MIN)*60e3);
     if(!e.home&&Walk.openOnly&&!openWhen(e,eta))continue;   /* open when you'd get there */
     if(!best||n2>best.n||(n2===best.n&&m<best.m))best={stops,end:e,m,n:n2,eta};
   }
 }
 return best;
}
const OSRM_MODE={walk:"routed-foot/route/v1/foot",bike:"routed-bike/route/v1/bike",drive:"routed-car/route/v1/driving"};
async function osrmRoute(pts,mode="walk",signal){
 const q=pts.map(p=>`${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(";");
 const ac=new AbortController(), to=setTimeout(()=>ac.abort(),12000);
 if(signal)signal.addEventListener("abort",()=>ac.abort());
 let r; try{ r=await fetch(`https://routing.openstreetmap.de/${OSRM_MODE[mode]}/${q}?overview=full&geometries=geojson`,{signal:ac.signal}); }
 catch(e){ throw new Error(e.name==="AbortError"?"routing server timed out":e.message); } finally{ clearTimeout(to); }
 const j=await r.json(); if(j.code!=="Ok")throw new Error(j.message||j.code);
 return {m:j.routes[0].distance,s:j.routes[0].duration,geo:j.routes[0].geometry,legs:j.routes[0].legs.map(l=>l.distance)};
}
async function planWalk(){
 const D=Walk.mins*WALK_MPM, key=[Walk.mins,Walk.endRvm,Walk.openOnly,HOME.lat.toFixed(4),HOME.lng.toFixed(4),SITES.map(s=>s.id+ready(s)).join()].join("|");
 if(Walk.key===key&&(Walk.plan||Walk.busy))return;   /* one plan per setting; renders don't re-request */
 Walk.busy=true;Walk.err=null;Walk.key=key;render();
 try{
   /* Try the walk you asked for; if no route past a unit to a return point
      fits, widen to 2x then 4x and say how much longer it is, rather than
      planning nothing. */
   let plan=null,route=null,c=null,DD=D;
   for(const f of [1,2,4]){
     DD=D*f; c=walkCandidates(DD); const excl=new Set();
     for(let tries=0;tries<6;tries++){
       plan=bestPlan(c,DD,excl);
       if(!plan)break;
       const pts=[c.start,...plan.stops.map(s=>s.ll),plan.end.ll];
       try{route=await osrmRoute(pts);}catch(e){route=null;Walk.err="Footpath routing unavailable, straight lines shown ("+e.message+")";break;}
       if(route.m<=DD*1.05||plan.stops.length<=1)break;
       const weakest=[...plan.stops].sort((a,b)=>avail(a)-avail(b))[0]; excl.add(weakest.id); /* too long on real paths: drop the weakest stop */
     }
     if(plan||Walk.key!==key)break;
   }
   if(Walk.key!==key)return;                       /* settings changed while routing: a newer plan is on its way */
   if(plan&&route)plan.eta=new Date(Date.now()+(route.s/60+plan.stops.length*STOP_MIN)*60e3);
   if(plan)Walk.plan={...plan,c,D:DD,asked:D,over:DD>D,route};
   else{ /* say why: no units, units too far, no return point near them, or none open */
     const units=SITES.filter(s=>s.ll&&avail(s)>0), near=units.map(s=>kmA(c.start,s.ll)).sort((a,b)=>a-b)[0];
     const why=!units.length?"nounits":!c.sites.length?"far":Walk.endRvm&&!c.rvms.length?"norp":Walk.endRvm&&Walk.openOnly?"closed":"far";
     Walk.plan={c,D,none:true,why,nearKm:near};
   }
 }catch(e){if(Walk.key!==key)return;Walk.err=String(e.message||e);Walk.plan=null;}
 Walk.busy=false; if(Store.state.screen.name==="walk")render();
}
function circleGeo(c,km){const pts=[];for(let i=0;i<=64;i++){const a=i/64*2*Math.PI;
 pts.push([c.lng+km/(111.32*Math.cos(c.lat*Math.PI/180))*Math.cos(a),c.lat+km/110.57*Math.sin(a)]);}
 return {type:"Feature",geometry:{type:"Polygon",coordinates:[pts]}};}
function mountWalkMap(){

 if(wmap){wmap.remove();wmap=null;} wmarkers=[];
 const P=Walk.plan, c=P?P.c:walkCandidates(Walk.mins*WALK_MPM);
 wmap=new maplibregl.Map({container:el,style:tileUrl(),center:[c.start.lng,c.start.lat],zoom:14,attributionControl:{compact:true},dragRotate:false,pitchWithRotate:false});

   wmarkers.push(new maplibregl.Marker({element:d,anchor:"center"}).setLngLat([ll.lng,ll.lat]).addTo(wmap));};
 const line=P&&!P.none?(P.route?P.route.geo:{type:"LineString",coordinates:[c.start,...P.stops.map(s=>s.ll),P.end.ll].map(p=>[p.lng,p.lat])}):null;
 wmap.on("load",()=>{
   const green=getComputedStyle(document.body).getPropertyValue("--green").trim()||"#166534";
   const blue=getComputedStyle(document.body).getPropertyValue("--blue").trim()||"#2563EB";

   wmap.addLayer({id:"catch-l",type:"line",source:"catch",paint:{"line-color":green,"line-width":1.5,"line-dasharray":[3,2]}});
   if(line){wmap.addSource("route",{type:"geojson",data:{type:"Feature",geometry:line}});
     wmap.addLayer({id:"route-c",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#fff","line-width":7}});
     wmap.addLayer({id:"route",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":blue,"line-width":4,...(P.route?{}:{"line-dasharray":[2,2]})}});}
 });
 /* everything else in the catchment, dimmed */
 REFUND_POINTS.filter(r=>r.ll&&r.type==="RVM"&&kmA(c.start,r.ll)<=Math.max(c.reach*1.4,1)&&!(P&&P.end&&P.end.id===r.id))

 SITES.filter(s=>s.ll&&showUnit(s)&&!(P&&P.stops&&P.stops.includes(s))).forEach(s=>add(`<div class="pin-u off" style="opacity:.55"><div class="b">${ready(s)}</div><div class="tip"></div></div>`,s.ll,2));
 if(P&&!P.none){

   if(!P.end.home)add(`<div class="pin-r ${isOpen(P.end)?"":"closed"}" style="outline:3px solid var(--blue-tint)" onclick="event.stopPropagation();Store.go('refund',{id:'${P.end.id}'})">${I.recy}</div>`,P.end.ll,5);
 }
 add('<div class="me"></div>',c.start,9);
 /* frame the walk */
 const pts=[[c.start.lng,c.start.lat]]; if(line)line.coordinates.forEach(p=>pts.push(p));
 const ring=circleGeo(c.start,c.reach).geometry.coordinates[0]; ring.forEach(p=>pts.push(p));
 const bb=pts.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(pts[0],pts[0]));
 wmap.fitBounds(bb,{padding:{top:30,bottom:30,left:24,right:24},maxZoom:17,duration:0});
}
